<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>币安 U 本位持仓看板</title>
<style>
:root {
  --bg: #0b0e13;
  --panel: #131823;
  --panel-2: #182030;
  --line: #232c3d;
  --text: #e6ecf5;
  --muted: #8393ab;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --radius: 10px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 12px 20px;
  background: rgba(11, 14, 19, 0.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand strong { font-size: 16px; letter-spacing: .3px; }
.tag {
  font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
}
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--muted); box-shadow: 0 0 0 0 rgba(34,197,94,.6);
}
.dot.live { background: var(--green); animation: pulse 2s infinite; }
.dot.stale { background: var(--amber); }
.dot.down { background: var(--red); }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
  70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}

.topbar-right { display: flex; align-items: center; gap: 12px; }
.meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.btn {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 12px; font-size: 12px; cursor: pointer;
}
.btn:hover { border-color: var(--blue); }
.btn.active { border-color: var(--green); color: var(--green); }

main { padding: 18px 20px 40px; max-width: 1500px; margin: 0 auto; }
.hidden { display: none !important; }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
}
.panel h2 {
  margin: 0 0 12px; font-size: 13px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: .8px;
}
.muted { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

.banner {
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
  border: 1px solid; font-size: 13px;
}
.banner.error { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.45); }
.banner.warn { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.45); }
.banner strong { display: block; margin-bottom: 4px; }

.setup {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px;
}
.setup h2 { margin-top: 0; font-size: 18px; }
.setup ol { padding-left: 20px; }
.setup li { margin-bottom: 6px; }
.setup code, .setup pre {
  background: #0a0d12; border: 1px solid var(--line); border-radius: 6px;
  font-family: Consolas, "Courier New", monospace; font-size: 12.5px;
}
.setup code { padding: 1px 6px; }
.setup pre { padding: 12px; overflow-x: auto; }
.setup .danger { color: var(--amber); }

.metrics {
  display: grid; gap: 12px; margin-bottom: 16px;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px;
}
.card .label { font-size: 11.5px; color: var(--muted); letter-spacing: .4px; }
.card .value {
  font-size: 21px; font-weight: 600; margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.card .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

.pos { color: var(--green); }
.neg { color: var(--red); }
.warnc { color: var(--amber); }

.health-track {
  height: 14px; border-radius: 999px; overflow: hidden;
  background: linear-gradient(90deg, #ef4444 0%, #f59e0b 35%, #22c55e 70%);
  opacity: .28; position: relative;
}
.health-fill {
  position: absolute; top: 0; right: 0; height: 100%;
  background: #0b0e13;
}
.health-labels {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 8px; font-size: 13px;
}
#health-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 8px 10px; color: var(--muted);
  font-size: 11.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
td {
  padding: 10px; border-bottom: 1px solid rgba(35,44,61,.6);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
tbody tr:hover { background: var(--panel-2); }
th.num, td.num { text-align: right; }

.sym { font-weight: 600; }
.side {
  display: inline-block; padding: 1px 8px; border-radius: 4px;
  font-size: 11.5px; font-weight: 600;
}
.side.LONG { background: rgba(34,197,94,.14); color: var(--green); }
.side.SHORT { background: rgba(239,68,68,.14); color: var(--red); }

.risk { font-size: 10.5px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
.risk.CRITICAL { background: rgba(239,68,68,.2); color: var(--red); }
.risk.WARNING { background: rgba(245,158,11,.2); color: var(--amber); }
.risk.WATCH { background: rgba(59,130,246,.2); color: var(--blue); }

.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert {
  display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px;
  border-left: 3px solid var(--muted); background: var(--panel-2); font-size: 13px;
}
.alert.CRITICAL { border-left-color: var(--red); }
.alert.WARNING { border-left-color: var(--amber); }
.alert.INFO { border-left-color: var(--blue); }
.alert .t { font-weight: 600; }
.alert .d { color: var(--muted); font-size: 12.5px; }

.two-col { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; } }

.kv-grid {
  display: grid; gap: 10px 20px;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}
/* 资产这类长内容占满整行，避免挤在半列里换行 */
.kv-grid.has-wide .kv-wide { grid-column: 1 / -1; }
.kv {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; border-bottom: 1px dashed rgba(35,44,61,.8); padding-bottom: 6px;
}
.kv .k { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.kv .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }

.bars { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.bar-row { display: grid; grid-template-columns: 90px 1fr 92px;
  align-items: center; gap: 10px; font-size: 12.5px; }
/* 复盘区多一列"条数/笔数" */
.bar-row.day-row, .bar-row.sym-row {
  grid-template-columns: 62px 1fr 92px 64px;
}
.bar-row.sym-row { grid-template-columns: 96px 1fr 92px 64px; }
.sub-h {
  margin: 18px 0 4px; font-size: 12px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
}
.bar-track { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }

/* 占比条：表格里的行内小条，直观看出集中程度 */
.share-cell {
  display: flex; align-items: center; gap: 8px;
  justify-content: flex-end; min-width: 108px;
}
.share-cell > span { min-width: 44px; text-align: right; }
.share-bar {
  height: 6px; border-radius: 999px; flex: 1;
  /* 用已定义的调色板变量；曾误用不存在的 --accent，样式会静默失效 */
  background: linear-gradient(90deg, var(--blue), var(--green));
  min-width: 2px;
}

/* 盈亏日历：每列一周、每行一个星期几（与 GitHub 贡献图一致） */
.cal-wrap { display: flex; gap: 6px; margin: 6px 0 4px; overflow-x: auto; }
.cal-labels {
  display: grid; grid-template-rows: repeat(7, 13px); gap: 3px;
  /* 必须给固定宽度：否则 grid 项会被拉伸到整行，标签跑到右边去 */
  flex: 0 0 20px; width: 20px;
}
.cal-wd {
  font-size: 10px; color: var(--muted); line-height: 13px; height: 13px;
  text-align: right; width: 20px;
}
.cal-grid {
  display: grid; grid-template-rows: repeat(7, 13px); gap: 3px;
  grid-auto-flow: column; grid-auto-columns: 13px;
}
.cal-cell { width: 13px; height: 13px; border-radius: 3px; }
.cal-cell.empty { background: transparent; }
.cal-cell.nodata { background: var(--panel-2); opacity: .45; }
.cal-cell.flat { background: var(--line); }
/* 正收益：绿色由浅到深 */
.cal-cell.pos-1 { background: rgba(34,197,94,.28); }
.cal-cell.pos-2 { background: rgba(34,197,94,.50); }
.cal-cell.pos-3 { background: rgba(34,197,94,.72); }
.cal-cell.pos-4 { background: rgba(34,197,94,1); }
/* 亏损：红色由浅到深 */
.cal-cell.neg-1 { background: rgba(239,68,68,.28); }
.cal-cell.neg-2 { background: rgba(239,68,68,.50); }
.cal-cell.neg-3 { background: rgba(239,68,68,.72); }
.cal-cell.neg-4 { background: rgba(239,68,68,1); }

.footnote { color: var(--muted); font-size: 11.5px; margin: 12px 0 0; line-height: 1.6; }
footer {
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 14px 20px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 11.5px;
}
.empty { color: var(--muted); padding: 14px 4px; font-size: 13px; }

.static-badge {
  font-size: 11px; color: var(--amber); border: 1px solid rgba(245,158,11,.5);
  border-radius: 999px; padding: 2px 8px;
}
.live-flag {
  font-size: 11px; color: var(--green); border: 1px solid rgba(34,197,94,.45);
  border-radius: 999px; padding: 2px 8px;
}
/* 数据导出按钮：小而不抢眼，但可点区域要够大 */
.dl-btn {
  font-size: 11px; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; cursor: pointer; margin-left: 8px;
}
.dl-btn:hover { border-color: var(--blue); color: #fff; }
.dl-btn:disabled { opacity: .45; cursor: default; }
.chart-wrap { margin: 4px 0 8px; }
.chart-wrap svg { display: block; overflow: visible; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot live"></span>
    <strong>币安 U 本位持仓看板</strong>
    <span class="tag">USDⓈ-M · BINANCE</span>
    <span class="static-badge">静态快照</span>
    <span class="muted" id="live-state"></span>
  </div>
  <div class="topbar-right">
    <span class="meta" id="gen-time"></span>
    <button class="dl-btn" id="dl-account" type="button">导出账户快照 CSV</button>
    <button class="dl-btn" id="dl-trades" type="button">导出持仓明细 CSV</button>
  </div>
</header>

<main>
  <div id="banner" class="banner hidden"></div>
  <div id="export-health" class="hidden"></div>

  <section id="alerts-section" class="panel hidden">
    <h2>风险提醒</h2>
    <div id="alerts" class="alerts"></div>
  </section>

  <section id="metrics-section" class="metrics hidden"></section>

  <section id="health-section" class="panel hidden">
    <h2>保证金健康度</h2>
    <div class="health-wrap">
      <div class="health-track"><div id="health-fill" class="health-fill"></div></div>
      <div class="health-labels">
        <span id="health-value">—</span>
        <span id="health-detail" class="muted"></span>
      </div>
    </div>
  </section>

  <section id="positions-section" class="panel hidden">
    <h2>持仓明细 <span id="pos-count" class="muted"></span></h2>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>合约</th><th>方向</th><th class="num">数量</th><th class="num">开仓价</th>
          <th class="num">标记价</th><th class="num">名义价值</th><th class="num">未实现盈亏</th>
          <th class="num">保证金占用</th><th class="num">强平价 / 距离</th>
          <th class="num">下次资金费</th><th>模式</th>
        </tr></thead>
        <tbody id="positions-body"></tbody>
      </table>
    </div>
    <p class="footnote">
      「距强平」为标记价到强平价的百分比距离，越大越安全；负数表示标记价已越过强平价。
      资金费为正表示收，为负表示付（按当时名义价值与最新资金费率估算）。
    </p>
  </section>

  <section id="cost-section" class="panel hidden">
    <h2>持仓成本归因</h2>
    <div id="cost-body"></div>
  </section>

  <section id="cost-analysis-section" class="panel hidden">
    <h2>成本与时耗分析 <span id="cost-analysis-range" class="muted"></span></h2>
    <div id="cost-analysis-body"></div>
  </section>

  <section id="trades-section" class="panel hidden">
    <h2>平仓明细 <span id="trades-range" class="muted"></span></h2>
    <div id="trades-body"></div>
  </section>

  <section id="attribution-section" class="panel hidden">
    <h2>盈亏归因 <span id="attribution-range" class="muted"></span></h2>
    <div id="attribution-body"></div>
  </section>

  <section id="calendar-section" class="panel hidden">
    <h2>盈亏日历 <span id="calendar-range" class="muted"></span></h2>
    <div id="calendar-body"></div>
  </section>

  <section id="risk-section" class="panel hidden">
    <h2>集中度与风险缓冲</h2>
    <div id="risk-body"></div>
  </section>

  <section id="local-section" class="panel hidden">
    <h2>本地记录与离线时段 <span id="local-range" class="muted"></span></h2>
    <div id="local-body"></div>
  </section>

  <section id="equity-section" class="panel hidden">
    <h2>近 3 个月资金曲线 <span id="equity-range" class="muted"></span></h2>
    <div id="equity-body"></div>
  </section>

  <section id="history-section" class="panel hidden">
    <h2>近 7 天复盘 <span id="history-range" class="muted"></span></h2>
    <div id="history-body"></div>
  </section>

  <section id="account-section" class="panel hidden">
    <h2>账户信息</h2>
    <div id="account-body" class="kv-grid"></div>
  </section>
</main>

<footer>
  <span>静态快照：页面内容为导出时刻的数据，不会自动刷新。</span>
  <span class="muted" id="foot-status"></span>
</footer>

    out += '<h3 class="sub-h" style="margin-top:0">毛利 → 净利的漏损（' + a.period_days + ' 天）</h3>' +
      '<div class="kv-grid">' +
        '<div class="kv"><span class="k">交易毛利</span><span class="v ' + cls(a.gross) + '">' +
          signedMoney(a.gross) + "</span></div>" +
        '<div class="kv"><span class="k">交易成本合计</span><span class="v neg">' +
          money(-a.costs) + "</span></div>" +
        '<div class="kv"><span class="k">净利</span><span class="v ' + cls(a.net) + '">' +
          signedMoney(a.net) + "</span></div>" +
        '<div class="kv"><span class="k">成本占毛利</span><span class="v ' + ratioCls + '">' +
          ratioTxt + "</span></div>" +
        '<div class="kv"><span class="k">手续费 / 资金费</span><span class="v">' +
          signedMoney(a.commission) + " / " + signedMoney(a.funding_fee) + "</span></div>" +
        '<div class="kv"><span class="k">返佣</span><span class="v ' + cls(a.rebate) + '">' +
          signedMoney(a.rebate) + "</span></div>" +
        '<div class="kv"><span class="k">日均毛利 / 成本</span><span class="v">' +
          money(a.gross_per_day) + " / " + money(a.cost_per_day) + "</span></div>" +
        '<div class="kv"><span class="k">盈亏比</span><span class="v">' +
          (a.profit_factor == null ? "—" : a.profit_factor.toFixed(2)) +
          ' <span class="muted">（均盈 ' + money(a.avg_win) + " / 均亏 " + money(a.avg_loss) + "）</span></span></div>" +
      "</div>";

    if (a.win_days != null && a.lose_days != null) {
      var tot = a.win_days + a.lose_days;
      var wr = tot > 0 ? (a.win_days / tot * 100) : 0;
      out += '<div class="bars" style="margin-top:10px">' +
        '<div class="bar-row"><span class="muted">胜率</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + wr +
        '%;background:var(--green)"></div></div>' +
        '<span style="text-align:right">' + a.win_days + " / " + tot +
        ' <span class="muted">天</span></span></div></div>';

      if (a.win_days < a.lose_days && a.profit_factor != null && a.profit_factor > 1) {
        out += '<p class="footnote">注意这个组合：<strong>亏损天数（' + a.lose_days +
          '）多于盈利天数（' + a.win_days + '），但盈亏比 ' + a.profit_factor.toFixed(2) +
          ' 让净额为正</strong>。说明盈利依赖少数大赚日，需要留意这类日的行情是否可复制。</p>';
      }
    }

    (a.notes || []).forEach(function (n) {
      out += '<p class="footnote ' + (n.level === "WARNING" ? "warnc" : "") + '">' +
        esc(n.text) + "</p>";
    });
  }

  // ---- 当前持仓的时间成本 ----
  if (h.available) {
    var dirTxt = h.total_daily_funding >= 0 ? "净收" : "净付";
    out += '<h3 class="sub-h">当前持仓的时间成本</h3>' +
      '<div class="kv-grid">' +
        '<div class="kv"><span class="k">合计日资金费</span><span class="v ' + cls(h.total_daily_funding) + '">' +
          dirTxt + " " + signedMoney(h.total_daily_funding) + "</span></div>" +
        '<div class="kv"><span class="k">占名义价值</span><span class="v">' +
          (h.total_daily_funding_pct == null ? "—" : h.total_daily_funding_pct.toFixed(3) + "%/天") +
          "</span></div>" +
        '<div class="kv"><span class="k">年化</span><span class="v ' + cls(h.annualized_total_pct) + '">' +
          (h.annualized_total_pct == null ? "—" : h.annualized_total_pct.toFixed(2) + "%") + "</span></div>" +
      "</div>" +
      '<div class="table-scroll" style="margin-top:12px"><table><thead><tr>' +
        "<th>合约</th><th>方向</th><th class=\"num\">名义价值</th>" +
        '<th class="num">资金费率</th><th class="num">日资金费</th>' +
        '<th class="num">年化</th><th class="num">浮盈耗尽天数</th>' +
      "</tr></thead><tbody>" +
      (h.per_symbol || []).map(function (p) {
        var d = p.days_until_pnl_consumed;
        var dTxt = d == null ? "—" : (d === 0 ? "已亏损" : d.toFixed(1) + " 天");
        return "<tr>" +
          '<td class="sym">' + esc(p.symbol) + "</td>" +
          '<td><span class="side ' + p.side + '">' + (p.side === "LONG" ? "多" : "空") + "</span></td>" +
          '<td class="num">' + money(p.notional) + "</td>" +
          '<td class="num">' + (p.funding_rate == null ? "—" : (p.funding_rate * 100).toFixed(4) + "%") + "</td>" +
          '<td class="num ' + cls(p.daily_funding) + '">' + signedMoney(p.daily_funding) +
            ' <span class="muted">' + esc(p.funding_direction) + "</span></td>" +
          '<td class="num">' + (p.annualized_pct == null ? "—" : p.annualized_pct.toFixed(2) + "%") + "</td>" +
          '<td class="num ' + (d != null && d <= 3 ? "neg" : "") + '">' + dTxt + "</td>" +
        "</tr>";
      }).join("") + "</tbody></table></div>" +
      '<p class="footnote">' + esc(h.note || "") +
      "资金费方向为「收」表示该仓位在赚取资金费。</p>";
  }

  // ---- 提醒 ----
  if (ca.alerts && ca.alerts.length) {
    out += '<div class="alerts" style="margin-top:14px">' +
      ca.alerts.map(function (al) {

          esc(al.title) + '</div><div class="d">' + esc(al.detail) + "</div></div></div>";
      }).join("") + "</div>";
  }

  $("cost-analysis-body").innerHTML = out;
}

function renderRisk(ra) {
  if (!ra || ra.error) return;
  var c = ra.concentration || {}, v = ra.volatility || {};
  if (!c.available && !v.available) return;
  show("risk-section", true);

  var out = "";

  // ---- 集中度 ----
  if (c.available) {
    var hhiTxt = c.hhi == null ? "—" : c.hhi.toFixed(3);
    var effTxt = c.effective_positions == null ? "—"
      : c.effective_positions.toFixed(2);

    out += '<h3 class="sub-h" style="margin-top:0">仓位集中度</h3>' +
      '<div class="kv-grid">' +
        '<div class="kv"><span class="k">持仓数</span><span class="v">' +
          c.count + " 个</span></div>" +
        '<div class="kv"><span class="k">总名义价值</span><span class="v">' +
          money(c.total_notional) + "</span></div>" +
        '<div class="kv"><span class="k">最大占比</span><span class="v ' +
          (c.top1_share >= 0.6 ? "warnc" : "") + '">' +
          (c.top1_share * 100).toFixed(1) + "%</span></div>" +
        '<div class="kv"><span class="k">HHI（归一化）</span><span class="v">' +
          hhiTxt + "</span></div>" +
        '<div class="kv"><span class="k">等价等权仓位</span><span class="v ' +
          (c.effective_positions < 1.6 && c.count >= 3 ? "warnc" : "") + '">' +
          effTxt + ' <span class="muted">/ ' + c.count + " 个</span></span></div>" +
        '<div class="kv"><span class="k">有效杠杆</span><span class="v">' +
          (c.effective_leverage == null ? "—" : c.effective_leverage.toFixed(2) + "x") +
          ' <span class="muted">名义/保证金</span></span></div>' +
        '<div class="kv"><span class="k">多 / 空 名义</span><span class="v">' +
          money(c.long_notional) + " / " + money(c.short_notional) + "</span></div>" +
        '<div class="kv"><span class="k">净敞口</span><span class="v ' +
          (Math.abs(c.net_exposure_pct || 0) > 80 ? "warnc" : "") + '">' +
          (c.net_exposure_pct == null ? "—" : (c.net_exposure_pct > 0 ? "+" : "") +
            c.net_exposure_pct.toFixed(1) + "%") + "</span></div>" +
      "</div>";

    // 名义分散 ≠ 实质分散。这是最容易被忽略、也最值得指出的一点。
    if (c.count >= 3 && c.effective_positions < 1.6) {
      out += '<p class="footnote warnc">注意：你有 ' + c.count +
        " 个持仓，但等价于仅 <strong>" + effTxt +
        " 个等权仓位</strong>——数量上的分散没有带来实质分散，" +
        "组合表现基本由最大那个仓位决定。</p>";
    }

    out += '<div class="table-scroll" style="margin-top:12px"><table><thead><tr>' +
      "<th>合约</th><th>方向</th><th class=\"num\">名义价值</th>" +
      '<th class="num">占比</th><th class="num">杠杆</th>' +
      '<th class="num">未实现盈亏</th><th class="num">爆仓距离</th>' +
      '<th class="num">可扛倍数</th><th>风险</th>' +
      "</tr></thead><tbody>";

    var vBySym = {};
    (v.per_symbol || []).forEach(function (r) { vBySym[r.symbol] = r; });

    (c.per_symbol || []).forEach(function (p) {
      var vr = vBySym[p.symbol] || {};
      var sb = vr.sigma_buffer;
      var sbTxt = sb == null ? "—" : sb.toFixed(2) + " 倍";
      // 占比条形：直观看出集中程度
      var barW = Math.max(2, Math.round(p.share * 100));
      out += "<tr>" +
        '<td class="sym">' + esc(p.symbol) + "</td>" +
        '<td><span class="side ' + p.side + '">' +
          (p.side === "LONG" ? "多" : "空") + "</span></td>" +
        '<td class="num">' + money(p.notional) + "</td>" +
        '<td class="num"><div class="share-cell"><div class="share-bar" style="width:' +
          barW + '%"></div><span>' + (p.share * 100).toFixed(1) + "%</span></div></td>" +
        '<td class="num">' + (p.leverage ? p.leverage.toFixed(0) + "x" : "—") + "</td>" +
        '<td class="num ' + cls(p.unrealized_pnl) + '">' +
          signedMoney(p.unrealized_pnl) + "</td>" +
        '<td class="num">' + (p.liquidation_distance_pct == null ? "—"
          : p.liquidation_distance_pct.toFixed(2) + "%") + "</td>" +
        '<td class="num ' + (sb != null && sb < 2 ? "neg" : "") + '">' + sbTxt + "</td>" +
        "<td>" + riskBadge(p.risk_level) + "</td>" +
      "</tr>";
    });
    out += "</tbody></table></div>" +
      '<p class="footnote">HHI 归一化后 0 = 完全均分、1 = 全压一个仓位。' +
      "「等价等权仓位」= 1 / HHI，可理解为名义上的分散程度实际等于几个等权仓位。</p>";
  }

  // ---- 波动率缓冲 ----
  if (v.available) {
    var volNote = ra.volatility_pending
      ? '<span class="muted">（部分合约的波动率仍在后台获取，下次刷新补齐）</span>'
      : "";
    out += '<h3 class="sub-h">波动率缓冲 ' + volNote + "</h3>" +
      '<div class="kv-grid">' +
        '<div class="kv"><span class="k">最脆弱合约</span><span class="v warnc">' +
          esc(v.weakest_symbol || "—") + "</span></div>" +
        '<div class="kv"><span class="k">最小可扛倍数</span><span class="v ' +
          (v.largest_sigma_buffer != null && v.largest_sigma_buffer < 2 ? "neg" : "") +
          '">' + (v.largest_sigma_buffer == null ? "—"
            : v.largest_sigma_buffer.toFixed(2) + " 倍日波动") + "</span></div>" +
        '<div class="kv"><span class="k">组合日波动</span><span class="v">' +
          (v.portfolio_daily_vol_pct == null ? "—"
            : "±" + v.portfolio_daily_vol_pct.toFixed(2) + "%") +
          ' <span class="muted">' + money(v.portfolio_daily_vol_usd) + "</span></span></div>" +
        '<div class="kv"><span class="k">波动率加权敞口</span><span class="v">' +
          money(v.vol_weighted_notional) + "</span></div>" +
      "</div>" +
      '<p class="footnote">' + esc(v.note || "") + "</p>";

    if (v.insights && v.insights.length) {
      out += '<div class="alerts" style="margin-top:12px">' +
        v.insights.map(function (i) {
          return '<div class="alert ' + (i.level || "INFO") + '"><div><div class="d">' +
            esc(i.text) + "</div></div></div>";
        }).join("") + "</div>";
    }
  } else if (c.available) {
    out += '<p class="footnote">波动率数据暂不可用（需联网取 K 线），' +
      "因此未计算「可扛倍数」。集中度部分不受影响。</p>";
  }

  // ---- 风险收益比 ----
  var rr = ra.risk_reward;
  if (rr && rr.available) {
    var rrk = rr.per_symbol || [];
    var hasAny = rrk.some(function (r) { return r.risk_reward != null; });
    if (hasAny) {
      out += '<h3 class="sub-h">风险收益比' +
        (rr.best_symbol ? ' <span class="muted">最划算：' +
          esc(rr.best_symbol) + " " + rr.best_ratio + "</span>" : "") +
        "</h3>" +
        '<div class="table-scroll"><table><thead><tr>' +
        "<th>合约</th><th class=\"num\">保证金回报</th>" +
        '<th class="num">爆仓距离</th><th class="num">风险收益比</th>' +
        '<th class="num">杠杆</th></tr></thead><tbody>' +
        rrk.map(function (r) {
          var ratioTxt = r.risk_reward == null ? "—"
            : (r.return_on_margin_pct > 0
                ? r.risk_reward.toFixed(2)
                : '<span class="muted">不适用</span>');
          return "<tr>" +
            '<td class="sym">' + esc(r.symbol) + "</td>" +
            '<td class="num ' + cls(r.return_on_margin_pct) + '">' +
              (r.return_on_margin_pct == null ? "—"
                : r.return_on_margin_pct.toFixed(1) + "%") + "</td>" +
            '<td class="num">' + (r.liquidation_distance_pct == null ? "—"
              : r.liquidation_distance_pct.toFixed(2) + "%") + "</td>" +
            '<td class="num ' + (r.return_on_margin_pct > 0 &&
              r.risk_reward >= 4 ? "pos" : "") + '">' + ratioTxt + "</td>" +
            '<td class="num">' + (r.leverage ? r.leverage.toFixed(0) + "x" : "—") +
            "</td>" +
          "</tr>";
        }).join("") + "</tbody></table></div>" +
        '<p class="footnote">' + esc(rr.note || "") + "</p>";

      if (rr.insights && rr.insights.length) {
        out += '<div class="alerts" style="margin-top:10px">' +
          rr.insights.map(function (i) {
            return '<div class="alert ' + (i.level || "INFO") +
              '"><div><div class="d">' + esc(i.text) +
              "</div></div></div>";
          }).join("") + "</div>";
      }
    }
  }

  // ---- 提醒 ----
  var extra = (ra.alerts || []).filter(function (a) {
    return a.text && a.level !== "INFO";
  });
  if (extra.length) {
    out += '<div class="alerts" style="margin-top:14px">' +
      extra.map(function (a) {
        return '<div class="alert ' + a.level + '"><div><div class="d">' +
          esc(a.text) + "</div></div></div>";
      }).join("") + "</div>";
  }

  $("risk-body").innerHTML = out;
}

function riskBadge(level) {
  var map = { SAFE: ["安全", "pos"], WATCH: ["留意", "warnc"],
              WARNING: ["警戒", "warnc"], CRITICAL: ["危险", "neg"] };
  var m = map[level] || ["—", ""];
  return '<span class="' + m[1] + '">' + m[0] + "</span>";
}

// ------------------------------------------------------------------ 盈亏日历
//
// 网格布局：**每列一周、每行一个星期几**（与 GitHub 贡献图一致）。
// 用 CSS grid + grid-auto-flow: column，让星期几沿纵轴排列。
var _WD = ["一", "二", "三", "四", "五", "六", "日"];

function renderCalendarGrid(cal) {
  if (!cal || !cal.available || !cal.weeks || !cal.weeks.length) return;
  show("calendar-section", true);

  var vals = [];
  cal.weeks.forEach(function (wk) {
    wk.forEach(function (d) { if (d) vals.push(d.value); });
  });
  var maxAbs = Math.max.apply(null, vals.map(Math.abs).concat([1]));

  function level(v) {
    if (!v) return 0;
    var r = Math.abs(v) / maxAbs;
    if (r < 0.25) return 1;
    if (r < 0.5) return 2;
    if (r < 0.75) return 3;
    return 4;
  }

  var first = null, last = null;
  cal.weeks.forEach(function (wk) {
    wk.forEach(function (d) {
      if (!d) return;
      if (!first) first = d.date;
      last = d.date;
    });
  });
  $("calendar-range").textContent = "· " + first + " ~ " + last;

  var out = "";
  out += '<div class="kv-grid" style="margin-bottom:12px">' +
    '<div class="kv"><span class="k">交易盈亏合计</span><span class="v ' +
      cls(cal.total) + '">' + signedMoney(cal.total) + "</span></div>" +
    '<div class="kv"><span class="k">有成交天数</span><span class="v">' +
      cal.traded_days + ' <span class="muted">天</span></span></div>' +
    '<div class="kv"><span class="k">盈利 / 亏损天</span><span class="v">' +
      '<span class="pos">' + cal.win_days + '</span> / <span class="neg">' +
      cal.lose_days + "</span></span></div>" +
    '<div class="kv"><span class="k">最佳单日</span><span class="v pos">' +
      signedMoney(cal.best.value) + ' <span class="muted">' +
      esc(cal.best.date) + "</span></span></div>" +
    '<div class="kv"><span class="k">最差单日</span><span class="v neg">' +
      signedMoney(cal.worst.value) + ' <span class="muted">' +
      esc(cal.worst.date) + "</span></span></div>" +
    '<div class="kv"><span class="k">最长连续亏损</span><span class="v ' +
      (cal.worst_losing_streak >= 4 ? "warnc" : "") + '">' +
      cal.worst_losing_streak + ' <span class="muted">天</span></span></div>' +
  "</div>";

  // 星期几标签 + 网格
  var labels = _WD.map(function (w) {
    return '<div class="cal-wd">' + w + "</div>";
  }).join("");

  var cells = cal.weeks.map(function (wk) {
    return wk.map(function (d) {
      if (!d) return '<div class="cal-cell empty"></div>';
      var lv = level(d.value);
      var kind = d.value > 0 ? "pos" : d.value < 0 ? "neg" : "flat";
      var cls2 = "cal-cell " + kind + "-" + lv + (d.no_data ? " nodata" : "");
      return '<div class="' + cls2 + '" title="' + esc(d.date) + "  " +
        (d.value >= 0 ? "+" : "") + d.value.toFixed(2) +
        (d.records ? "  （" + d.records + " 笔）" : "  （无成交）") +
        '"></div>';
    }).join("");
  }).join("");

  out += '<div class="cal-wrap"><div class="cal-labels">' + labels +
    '</div><div class="cal-grid">' + cells + "</div></div>";

  // 按星期几的统计：找出"哪一天最容易亏"
  if (cal.by_weekday && cal.by_weekday.length) {
    var worstWd = null;
    cal.by_weekday.forEach(function (w) {
      if (w.count >= 3 && (!worstWd || w.value < worstWd.value)) worstWd = w;
    });

    out += '<h3 class="sub-h">按星期几分布</h3>' +
      '<div class="table-scroll"><table><thead><tr>' +
      "<th>星期</th><th class=\"num\">成交天</th><th class=\"num\">合计</th>" +
      '<th class="num">日均</th><th class="num">胜率</th>' +
      "</tr></thead><tbody>" +
      cal.by_weekday.map(function (w) {
        return "<tr>" +
          "<td>周" + _WD[w.weekday] + "</td>" +
          '<td class="num">' + w.count + "</td>" +
          '<td class="num ' + cls(w.value) + '">' + signedMoney(w.value) + "</td>" +
          '<td class="num ' + cls(w.avg) + '">' + signedMoney(w.avg) + "</td>" +
          '<td class="num">' +
            (w.win_rate == null ? "—" : (w.win_rate * 100).toFixed(0) + "%") +
          "</td></tr>";
      }).join("") + "</tbody></table></div>";

    if (worstWd && worstWd.value < 0) {
      out += '<p class="footnote warnc">注意：<strong>周' + _WD[worstWd.weekday] +
        "</strong> 在 " + worstWd.count + " 个交易日里合计 " +
        signedMoney(worstWd.value) + "，是所有星期几中最差的。" +
        "样本还小，但值得留意是不是有固定的行为模式。</p>";
    }
  }

  out += '<p class="footnote">' + esc(cal.note || "") + "</p>";
  $("calendar-body").innerHTML = out;
}

// ------------------------------------------------------------------ 数据导出
//
// 用 Blob 在前端生成 CSV 并触发下载——页面是自包含的，
// 不需要后端、也不必回到这台机器上跑脚本。
// **开头写 UTF-8 BOM**：否则 Excel 会把中文表头当成乱码。
function downloadCsv(filename, text) {
  if (!text) return false;
  var blob = new Blob(["\ufeff" + text], { type: "text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  return true;
}

function csvEscape(v) {
  var s = (v == null ? "" : String(v));
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function buildPositionsCsv() {
  var pos = (DATA && DATA.positions) || [];
  var live = pos.filter(function (p) { return p.side && p.side !== "FLAT"; });
  if (!live.length) return "";
  var cols = [
    ["symbol", "合约"], ["side", "方向"], ["position_amt", "数量"],
    ["entry_price", "开仓价"], ["mark_price", "标记价"],
    ["notional", "名义价值"], ["unrealized_pnl", "未实现盈亏"],
    ["leverage", "杠杆"], ["initial_margin", "初始保证金"],
    ["maintenance_margin", "维持保证金"],
    ["liquidation_price", "强平价"],
    ["liquidation_distance_pct", "强平距离%"],
    ["margin_ratio_pct", "保证金率%"], ["risk_level", "风险"],
    ["funding_rate", "资金费率"], ["margin_type", "保证金模式"]
  ];
  var out = [cols.map(function (c) { return c[1]; }).join(",")];
  live.forEach(function (p) {
    out.push(cols.map(function (c) { return csvEscape(p[c[0]]); }).join(","));
  });
  return out.join("\n");
}

function bindDownload(id, builder) {
  var btn = $(id);
  if (!btn) return;
  btn.addEventListener("click", function () {
    var text = builder();
    if (!text) {
      var old = btn.textContent;
      btn.textContent = "当前没有可导出的数据";
      btn.disabled = true;
      setTimeout(function () { btn.textContent = old; btn.disabled = false; }, 2000);
      return;
    }
    var base = PAYLOAD.filename_base || "binance-dashboard";
    downloadCsv(base + "-" + id.replace("dl-", "") + ".csv", text);
  });
}

function setupDownloads() {
  bindDownload("dl-account", function () {
    return (PAYLOAD.csv && PAYLOAD.csv.account) || "";
  });
  bindDownload("dl-trades", buildPositionsCsv);
}

// ------------------------------------------------------------------ 导出健康
//
// 定时任务静默失败时，页面上的数字会"看起来正常但其实是旧的"。
// 这个横幅把这些情况显式说出来：连续失败、数据陈旧。
function renderExportHealth(h) {
  if (!h || !h.available) return;
  var problems = h.problems || [];
  // INFO 级（例如"尚无导出记录"）不放顶部，避免噪音
  var notable = problems.filter(function (p) {
    return p.level === "WARNING" || p.level === "CRITICAL";
  });
  if (!notable.length) return;

  var cells = notable.map(function (p) {
    return '<div class="alert ' + p.level + '"><div><div class="t">' +
      esc(p.title) + '</div><div class="d">' + esc(p.detail) + "</div></div></div>";
  }).join("");

  var summary = "近 10 次导出 " + h.recent_ok + "/" + h.recent_total + " 成功" +
    (h.stale_minutes == null ? "" :
      "，数据距今 " + (h.stale_minutes < 90
        ? Math.round(h.stale_minutes) + " 分钟"
        : (h.stale_minutes / 60).toFixed(1) + " 小时")) + "。";

  var el = $("export-health");
  if (!el) return;
  el.className = "panel";
  el.innerHTML = '<h2>导出链路提醒</h2><div class="alerts">' + cells +
    "</div>" + '<p class="footnote">' + esc(summary) +
    " 定时任务只在你已登录且机器开机时运行；关机期间不会更新。</p>";
}

// ------------------------------------------------------------------ 平仓明细
//
// 数据来自成交重建（trades.py）：把一笔笔成交还原成"一段持仓"。
// 首次要等币安异步导出（约 100 秒），所以**没结果时显示"正在计算"**，
// 而不是渲染一张空表——空表会被误读成"没有成交"。
function renderTrades(rep, pending) {
  var sec = $("trades-section");
  if (!sec) return;

  if (pending && !rep) {
    show("trades-section", true);
    $("trades-body").innerHTML =
      '<p class="footnote">正在导出成交明细——币安的异步导出固定需要约 100 秒' +
      '（服务端生成文件的开销，与数据量无关）。稍后刷新本页即可看到结果。</p>';
    $("trades-range").textContent = "";
    return;
  }
  if (!rep) return;

  if (rep.error && !rep.available) {
    show("trades-section", true);
    $("trades-body").innerHTML =
      '<div class="alert WARNING"><div><div class="t">平仓明细暂不可用</div>' +
      '<div class="d">' + esc(rep.error) + "</div><div class=\"d\">" +
      esc(rep.hint || "") + "</div></div></div>";
    return;
  }
  if (!rep.available) {
    // 拿到了结论但没有可统计的平仓段。分两种：
    //   有 hint → 是"需要你去处理"（例如没配密钥），要显眼
    //   没 hint → 只是"这段时间没有已平仓的持仓"，平淡说明即可
    show("trades-section", true);
    if (rep.hint) {
      $("trades-body").innerHTML =
        '<div class="alert INFO"><div><div class="t">' +
        esc(rep.reason || "平仓明细不可用") + '</div><div class="d">' +
        esc(rep.hint) + "</div></div></div>";
    } else {
      $("trades-body").innerHTML = '<p class="footnote">' +
        esc(rep.reason || "这段时间内没有已平仓的持仓。") + "</p>";
    }
    return;
  }

  show("trades-section", true);
  $("trades-range").textContent = rep.fetched_at
    ? "· 成交 " + (rep.fills || 0) + " 笔 · 取数于 " + rep.fetched_at : "";

  var out = '<div class="kv-grid">' +
    '<div class="kv"><span class="k">已平仓段数</span><span class="v">' +
      rep.count + ' <span class="muted">段</span></span></div>' +
    '<div class="kv"><span class="k">净盈亏</span><span class="v ' +
      cls(rep.net_pnl) + '">' + signedMoney(rep.net_pnl) + "</span></div>" +
    '<div class="kv"><span class="k">胜 / 负</span><span class="v">' +
      '<span class="pos">' + rep.win_count + '</span> / <span class="neg">' +
      rep.lose_count + '</span> <span class="muted">胜率 ' +
      (rep.win_rate * 100).toFixed(0) + "%</span></span></div>" +
    '<div class="kv"><span class="k">盈亏比</span><span class="v">' +
      (rep.profit_factor == null ? "—" : rep.profit_factor.toFixed(2)) +
      ' <span class="muted">均盈 ' + money(rep.avg_win) + " / 均亏 " +
      money(rep.avg_loss) + "</span></span></div>" +
    '<div class="kv"><span class="k">每段期望</span><span class="v ' +
      cls(rep.expectancy) + '">' + signedMoney(rep.expectancy) + "</span></div>" +
    '<div class="kv"><span class="k">平均持有</span><span class="v">' +
      rep.avg_duration_hours.toFixed(1) + ' <span class="muted">小时</span></span></div>' +
    '<div class="kv"><span class="k">最佳一段</span><span class="v pos">' +
      signedMoney(rep.best.net_pnl) + ' <span class="muted">' +
      esc(rep.best.symbol) + " " + esc(rep.best.exit_time || "") +
      "</span></span></div>" +
    '<div class="kv"><span class="k">最差一段</span><span class="v neg">' +
      signedMoney(rep.worst.net_pnl) + ' <span class="muted">' +
      esc(rep.worst.symbol) + " " + esc(rep.worst.exit_time || "") +
      "</span></span></div>" +
  "</div>";

  if (rep.cross_check) {
    var cc = rep.cross_check;
    if (cc.ok) {
      out += '<p class="footnote pos">已与币安的资金流水交叉验证：' +
        "重建的已实现盈亏（" + money(cc.rebuilt_total) + "）与币安记录（" +
        money(cc.declared_total) + "）一致，说明重建逻辑可信。</p>";
    } else {
      out += '<p class="footnote warnc">与币安流水存在差异（重建 ' +
        money(cc.rebuilt_total) + " vs 声明 " + money(cc.declared_total) +
        "）。这通常意味着成交导出区间与流水区间不完全一致，" +
        "下面按合约的金额可能不完整。</p>";
    }
  }

  // 按合约
  if (rep.by_symbol && rep.by_symbol.length) {
    out += '<h3 class="sub-h">按合约</h3>' +
      '<div class="table-scroll"><table><thead><tr>' +
      "<th>合约</th><th class=\"num\">段数</th><th class=\"num\">胜率</th>" +
      '<th class="num">净盈亏</th><th class="num">手续费</th>' +
      '<th class="num">合计持有</th></tr></thead><tbody>' +
      rep.by_symbol.map(function (d) {
        return "<tr>" +
          '<td class="sym">' + esc(d.symbol) + "</td>" +
          '<td class="num">' + d.trades + "</td>" +
          '<td class="num">' +
            (d.win_rate == null ? "—" : (d.win_rate * 100).toFixed(0) + "%") +
          "</td>" +
          '<td class="num ' + cls(d.net_pnl) + '">' + signedMoney(d.net_pnl) + "</td>" +
          '<td class="num neg">' + money(d.commission) + "</td>" +
          '<td class="num">' + d.duration_hours.toFixed(1) + "h</td>" +
        "</tr>";
      }).join("") + "</tbody></table></div>";
  }

  if (rep.open_count) {
    out += '<p class="footnote">另有 ' + rep.open_count +
      " 段尚未平仓（不计入以上统计）。</p>";
  }
  out += '<p class="footnote">「一段持仓」= 从开仓到数量归零的过程。' +
    "中途加减仓会合并为同一段，反手会拆成两段（先平后开）。</p>";

  $("trades-body").innerHTML = out;
}

//
// 回答"钱是从哪些合约赚来/亏掉的"。两个视角各有取舍：
//   短期（约 7 天）：能拆分已实现/手续费/资金费，但窗口短

  function bar(pct) {
    var w = Math.min(100, Math.max(2, Math.round(Math.abs(pct) * 100)));

    out += '<div class="kv-grid">' +

        (s.top_winner.share_of_wins * 100).toFixed(0) + "%</span></span></div>" : "") +
      (s.top_loser ? '<div class="kv"><span class="k">最主要亏损来源</span>' +
        '<span class="v neg">' + esc(s.top_loser.symbol) + " " +
        signedMoney(s.top_loser.net) + ' <span class="muted">占亏损 ' +
        (s.top_loser.share_of_losses * 100).toFixed(0) + "%</span></span></div>" : "") +
    "</div>";

    out += '<div class="table-scroll" style="margin-top:12px"><table><thead><tr>' +

      '<th class="num">手续费</th><th class="num">资金费</th>' +
      '<th class="num">净额</th><th class="num">占比</th>' +

        return "<tr>" +
          '<td class="sym">' + esc(r.symbol) + "</td>" +
          '<td class="num ' + cls(r.realized_pnl) + '">' +

          '<td class="num ' + cls(r.funding_fee) + '">' +
            signedMoney(r.funding_fee) + "</td>" +
          '<td class="num ' + cls(r.net) + '"><strong>' + signedMoney(r.net) +
            "</strong></td>" +
          '<td class="num">' + (r.share == null ? "—"
            : (r.share * 100).toFixed(1) + "%") + "</td>" +
        "</tr>";
      }).join("") + "</tbody></table></div>" +
      '<p class="footnote">短期用币安流水（只勾选了「允许读取」，' +
      "该接口可回溯约 7 天）。净额 = 已实现盈亏 + 手续费 + 资金费。</p>";
  }

  // ---- 长期：只有净额 ----
  if (l.available) {

      $("attribution-range").textContent = "· " +
        (l.period_start || "") + " ~ " + (l.period_end || "");
    }
    out += '<h3 class="sub-h">近 ' + (l.days || "—") +
      ' 天按合约净额（前 ' + l.rows.length + " / 共 " + l.count + "）</h3>" +

      "<th>合约</th><th class=\"num\">净额</th><th class=\"num\">占比</th>" +

      "所以两表数字不能直接相加。</p>";

  $("attribution-body").innerHTML = out;

function renderEquity(eq) {
  if (!eq || eq.empty || !eq.series || !eq.series.length) return;
  show("equity-section", true);

  var t = eq.totals || {};
  $("equity-range").textContent = "· " + eq.start + " ~ " + eq.end +
    "（" + eq.days + " 天，" + eq.record_count + " 条流水）";

  // ---- 内联 SVG 曲线：累计交易盈亏 ----
  var W = 1000, H = 260, PL = 62, PR = 16, PT = 14, PB = 26;
  var iw = W - PL - PR, ih = H - PT - PB;
  var pts = eq.series.map(function (d) { return d.cumulative_trade; });
  var lo = Math.min.apply(null, pts.concat([0]));
  var hi = Math.max.apply(null, pts.concat([0]));
  if (hi === lo) { hi = lo + 1; }
  var pad = (hi - lo) * 0.08;
  lo -= pad; hi += pad;
  var n = pts.length;
  var X = function (i) { return PL + (n <= 1 ? iw / 2 : iw * i / (n - 1)); };
  var Y = function (v) { return PT + ih * (1 - (v - lo) / (hi - lo)); };

  var line = pts.map(function (v, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); }).join(" ");
  var area = line + " L" + X(n - 1).toFixed(1) + " " + Y(0).toFixed(1) +
             " L" + X(0).toFixed(1) + " " + Y(0).toFixed(1) + " Z";
  var zeroY = Y(0);

  // 网格与刻度
  var ticks = "";
  for (var k = 0; k <= 4; k++) {
    var v = lo + (hi - lo) * k / 4;
    var y = Y(v);
    ticks += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) +
             '" y2="' + y.toFixed(1) + '" stroke="#232c3d" stroke-width="1"/>' +
             '<text x="' + (PL - 6) + '" y="' + (y + 3.5).toFixed(1) +
             '" fill="#8393ab" font-size="10" text-anchor="end">' +
             (v >= 0 ? "+" : "") + Math.round(v).toLocaleString() + "</text>";
  }
  // X 轴日期（首、中、末）
  var xs = [0, Math.floor(n / 2), n - 1].map(function (i) {
    return '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) +
           '" fill="#8393ab" font-size="10" text-anchor="middle">' +
           eq.series[i].date.slice(5) + "</text>";
  }).join("");

  var svg = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto">' +
    ticks +
    '<line x1="' + PL + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - PR) +
      '" y2="' + zeroY.toFixed(1) + '" stroke="#3a465c" stroke-width="1" stroke-dasharray="3 3"/>' +
    '<path d="' + area + '" fill="rgba(34,197,94,0.10)"/>' +
    '<path d="' + line + '" fill="none" stroke="#22c55e" stroke-width="2"/>' +
    xs + "</svg>";

  // ---- 类型明细条形 ----
  var typeNames = {
    REALIZED_PNL: "已实现盈亏", COMMISSION: "手续费", FUNDING_FEE: "资金费",
    COMMISSION_REBATE: "返佣"
  };
  var tkeys = Object.keys(eq.types || {});
  var maxT = Math.max.apply(null, tkeys.map(function (k) { return Math.abs(eq.types[k]); }).concat([1e-9]));
  var typeRows = tkeys.map(function (k) {
    var v = eq.types[k];
    var w = Math.abs(v) / maxT * 100;
    var col = v >= 0 ? "var(--green)" : "var(--red)";
    return '<div class="bar-row sym-row"><span class="muted">' + esc(typeNames[k] || k) +
      '</span><div class="bar-track"><div class="bar-fill" style="width:' + w +
      "%;background:" + col + '"></div></div><span class="' + cls(v) +
      '" style="text-align:right">' + signedMoney(v) + "</span><span></span></div>";
  }).join("");

  var cached = eq._cached_at ? new Date(eq._cached_at * 1000).toLocaleString("zh-CN") : "—";

  $("equity-body").innerHTML =
    '<div class="kv-grid">' +
      '<div class="kv"><span class="k">交易盈亏（3 个月）</span><span class="v ' + cls(t.trading_pnl) + '">' + signedMoney(t.trading_pnl) + "</span></div>" +
      '<div class="kv"><span class="k">资金变化（含出入金）</span><span class="v ' + cls(t.net) + '">' + signedMoney(t.net) + "</span></div>" +
      '<div class="kv"><span class="k">出入金净额</span><span class="v ' + cls(t.capital_flow) + '">' + signedMoney(t.capital_flow) + "</span></div>" +
      '<div class="kv"><span class="k">最大回撤</span><span class="v neg">' + signedMoney(eq.max_drawdown) + "</span></div>" +
      '<div class="kv"><span class="k">盈利 / 亏损天数</span><span class="v">' + eq.win_days + " / " + eq.lose_days + "</span></div>" +
      '<div class="kv"><span class="k">最佳 / 最差单日</span><span class="v"><span class="pos">' +
        signedMoney(eq.best_day.value) + '</span> / <span class="neg">' + signedMoney(eq.worst_day.value) + "</span></span></div>" +
    "</div>" +
    '<h3 class="sub-h">累计交易盈亏曲线（不含出入金，单位 USDT）</h3>' +
    '<div class="chart-wrap">' + svg + "</div>" +
    '<h3 class="sub-h" style="margin-top:26px">资金构成</h3>' +
    '<div class="bars">' + typeRows + "</div>" +
    '<p class="footnote">数据来源：币安异步导出接口（/fapi/v1/income/asyn），' +
      "区间 " + esc(eq.start) + " ~ " + esc(eq.end) + "，共 " + eq.record_count + " 条流水。" +
      "曲线为<strong>累计交易盈亏</strong>，已剔除入金/出金与账户划转，反映真实交易结果。" +
      "币安不提供历史净值快照，因此无法还原「某天账户值多少钱」。" +
      '<br>曲线数据生成于 ' + esc(cached) + "（缓存 6 小时）。</p>";
}

function render() {
  $("gen-time").textContent = "数据时间 " + (META.generated_at_local || META.generated_at || "—");
  $("foot-status").textContent = "导出时间 " + META.exported_at;

  if (DATA.status !== "ok" && DATA.status !== undefined) {
    $("banner").className = "banner error";
    $("banner").innerHTML = "<strong>快照不可用</strong><span>" +
      esc(DATA.message || DATA.status) + "</span>";
    show("banner", true);
    return;
  }

  var m = DATA.metrics || {}, ps = DATA.position_summary || {};

  // 提醒
  var alerts = DATA.alerts || [];
  if (alerts.length) {
    show("alerts-section", true);
    $("alerts").innerHTML = alerts.map(function (a) {
      return '<div class="alert ' + a.level + '"><div><div class="t">' + esc(a.title) +
             '</div><div class="d">' + esc(a.detail) + "</div></div></div>";
    }).join("");
  }

  // 指标卡
  var cards = [
    { label: "钱包余额", value: money(m.wallet_balance), sub: "保证金余额 " + money(m.margin_balance) },
    { label: "未实现盈亏", value: '<span class="' + cls(m.unrealized_pnl) + '">' +
        signedMoney(m.unrealized_pnl) + "</span>", sub: "可用余额 " + money(m.available_balance) },
    { label: "持仓名义价值", value: money(ps.gross_notional), sub: "净敞口 " + signedMoney(ps.net_notional) },
    { label: "账户杠杆", value: num(m.account_leverage, 2) + "x",
      sub: "持仓 " + (ps.count || 0) + "（多 " + (ps.long_count || 0) + " / 空 " + (ps.short_count || 0) + "）" },
    { label: "维持保证金", value: money(m.maintenance_margin),
      sub: "占保证金余额 " + ((m.margin_ratio || 0) * 100).toFixed(2) + "%" },
    { label: "多空名义比", value: isNum(ps.long_short_ratio) ? ps.long_short_ratio.toFixed(2) : "—",
      sub: "多 " + money(ps.long_notional, 0) + " / 空 " + money(ps.short_notional, 0) }
  ];
  show("metrics-section", true);
  $("metrics-section").innerHTML = cards.map(function (c) {
    return '<div class="card"><div class="label">' + esc(c.label) + '</div><div class="value">' +
      c.value + '</div><div class="sub">' + c.sub + "</div></div>";
  }).join("");

  // 保证金健康度
  var h = isNum(m.margin_health_pct) ? m.margin_health_pct : 100;
  show("health-section", true);
  $("health-fill").style.width = Math.max(0, Math.min(100, 100 - h)) + "%";
  var color = h < 20 ? "var(--red)" : h < 40 ? "var(--amber)" : "var(--green)";
  $("health-value").innerHTML = '<span style="color:' + color + '">' + h.toFixed(1) + "%</span>";
  $("health-detail").textContent = "维持保证金率 " + ((m.margin_ratio || 0) * 100).toFixed(2) +
    "%（" + (m.margin_ratio_source === "computed" ? "本地计算" : m.margin_ratio_source || "—") +
    "） · 初始保证金 " + money(m.initial_margin) + " · 账户模式 " + (m.position_mode || "—");

  // 持仓
  var rows = DATA.positions || [];
  show("positions-section", true);
  $("pos-count").textContent = "· " + rows.length + " 个持仓";
  if (!rows.length) {
    $("positions-body").innerHTML = '<tr><td colspan="11" class="empty">导出时没有持仓。</td></tr>';
  } else {
    $("positions-body").innerHTML = rows.map(function (p) {
      var dist = p.liquidation_distance_pct;
      var riskTag = p.risk_level && p.risk_level !== "SAFE"
        ? '<span class="risk ' + p.risk_level + '">' + p.risk_level + "</span>" : "";
      return "<tr>" +
        '<td class="sym">' + esc(p.symbol) + "</td>" +
        '<td><span class="side ' + p.side + '">' + (p.side === "LONG" ? "多" : "空") + "</span>" + riskTag + "</td>" +
        '<td class="num">' + num(Math.abs(p.position_amt), 8) + "</td>" +
        '<td class="num">' + num(p.entry_price, 8) + "</td>" +
        '<td class="num">' + num(p.mark_price, 8) + "</td>" +
        '<td class="num">' + money(p.notional, 2) + '<br><span class="muted" style="font-size:11px">' +
          num(p.leverage, 0) + "x 杠杆</span></td>" +
        '<td class="num ' + cls(p.unrealized_pnl) + '">' + signedMoney(p.unrealized_pnl) +
          '<br><span class="muted" style="font-size:11px">' + pct(p.return_on_margin_pct) + "</span></td>" +
        '<td class="num">' + money(p.initial_margin, 2) +
          '<br><span class="muted" style="font-size:11px">' +
          (isNum(p.margin_ratio_pct) ? p.margin_ratio_pct.toFixed(2) + "% 占用" : "占用率 n/a") + "</span></td>" +
        '<td class="num">' + (p.liquidation_price ? num(p.liquidation_price, 8) : "—") +
          '<br><span class="' + (isNum(dist) ? cls(-dist) : "") + '" style="font-size:11px">' +
          (isNum(dist) ? pct(dist) : "—") + "</span></td>" +
        '<td class="num ' + cls(p.funding_cost_next) + '">' +
          (isNum(p.funding_cost_next) ? signedMoney(p.funding_cost_next, 2) : "—") +
          '<br><span class="muted" style="font-size:11px">' +
          (isNum(p.funding_rate) ? (p.funding_rate * 100).toFixed(4) + "%" : "") + "</span></td>" +
        "<td>" + (p.margin_type === "ISOLATED" ? "逐仓" : "全仓") + "</td></tr>";
    }).join("");
  }

  // 成本归因
  var c24 = m.funding_cost_24h, c7 = m.funding_cost_7d;
  if (c24) {
    show("cost-section", true);
    var rowsKv = [
      ["24h 资金费（正=收）", c24.funding_fee], ["24h 手续费", c24.commission],
      ["24h 已实现盈亏", c24.realized_pnl], ["24h 合计净额", c24.total]
    ];
    var extra = c7 ? [["7d 资金费", c7.funding_fee], ["7d 已实现盈亏", c7.realized_pnl]] : [];
    $("cost-body").innerHTML = '<div class="kv-grid">' +
      rowsKv.concat(extra).map(function (r) {
        return '<div class="kv"><span class="k">' + esc(r[0]) + '</span><span class="v ' +
          cls(r[1]) + '">' + signedMoney(r[1]) + "</span></div>";
      }).join("") + "</div>" +
      '<p class="footnote">数据来源 /fapi/v1/income。资金费是持仓的隐性成本，' +
      "长持仓位尤其要盯这一项。</p>";
  }

  // 7 天复盘
  if (c7 && c7.daily && c7.daily.length) {
    show("history-section", true);
    var start = META.generated_at_local || "";
    $("history-range").textContent = "· " + c7.record_count + " 条流水（按天分窗收集）";

    var maxAbs = Math.max.apply(null, c7.daily.map(function (d) {
      return Math.abs(d.net); }).concat([1e-9]));
    var dayRows = c7.daily.map(function (d) {
      var w = (Math.abs(d.net) / maxAbs) * 100;
      var col = d.net >= 0 ? "var(--green)" : "var(--red)";
      return '<div class="bar-row day-row"><span class="muted">' + esc(d.date.slice(5)) +
        '</span><div class="bar-track"><div class="bar-fill" style="width:' + w +
        "%;background:" + col + '"></div></div><span class="' + cls(d.net) +
        '" style="text-align:right">' + signedMoney(d.net) +
        '</span><span class="muted" style="text-align:right;font-size:11px">' +
        d.records + " 条</span></div>";
    }).join("");

    var syms = (c7.by_symbol || []).slice().reverse();
    var maxSym = Math.max.apply(null, syms.map(function (s) {
      return Math.abs(s.realized_pnl + s.commission + s.funding_fee); }).concat([1e-9]));
    var symRows = syms.map(function (s) {
      var net = s.realized_pnl + s.commission + s.funding_fee;
      var w = (Math.abs(net) / maxSym) * 100;
      var col = net >= 0 ? "var(--green)" : "var(--red)";
      return '<div class="bar-row sym-row"><span class="sym">' + esc(s.symbol) +
        '</span><div class="bar-track"><div class="bar-fill" style="width:' + w +
        "%;background:" + col + '"></div></div><span class="' + cls(net) +
        '" style="text-align:right">' + signedMoney(net) +
        '</span><span class="muted" style="text-align:right;font-size:11px">' +
        s.trades + " 笔</span></div>";
    }).join("");

    var symTable = syms.map(function (s) {
      var net = s.realized_pnl + s.commission + s.funding_fee;
      return "<tr><td class=\"sym\">" + esc(s.symbol) +
        '</td><td class="num ' + cls(s.realized_pnl) + '">' + signedMoney(s.realized_pnl) +
        '</td><td class="num ' + cls(s.funding_fee) + '">' + signedMoney(s.funding_fee) +
        '</td><td class="num ' + cls(s.commission) + '">' + signedMoney(s.commission) +
        '</td><td class="num ' + cls(net) + '">' + signedMoney(net) +
        '</td><td class="num">' + s.trades + "</td></tr>";
    }).join("");

    $("history-body").innerHTML =
      '<div class="kv-grid">' +
        '<div class="kv"><span class="k">7 天净额</span><span class="v ' + cls(c7.total) + '">' + signedMoney(c7.total) + "</span></div>" +
        '<div class="kv"><span class="k">已实现盈亏</span><span class="v ' + cls(c7.realized_pnl) + '">' + signedMoney(c7.realized_pnl) + "</span></div>" +
        '<div class="kv"><span class="k">资金费</span><span class="v ' + cls(c7.funding_fee) + '">' + signedMoney(c7.funding_fee) + "</span></div>" +
        '<div class="kv"><span class="k">手续费</span><span class="v ' + cls(c7.commission) + '">' + signedMoney(c7.commission) + "</span></div>" +
      "</div>" +
      '<h3 class="sub-h">每日净额（按本地日聚合）</h3><div class="bars">' + dayRows + "</div>" +
      '<h3 class="sub-h">按合约归因（净额 = 已实现 + 资金费 + 手续费）</h3><div class="bars">' + symRows + "</div>" +
      '<div class="table-scroll" style="margin-top:12px"><table><thead><tr><th>合约</th>' +
      '<th class="num">已实现盈亏</th><th class="num">资金费</th><th class="num">手续费</th>' +
      '<th class="num">净额</th><th class="num">成交笔数</th></tr></thead><tbody>' +
      symTable + "</tbody></table></div>" +
      '<p class="footnote">币安该接口实际可回溯约 7 天。</p>';
  }

  // 成本与时耗分析
  renderCostAnalysis(COST);

  // 集中度与风险缓冲
  renderRisk(RISK);

  // 盈亏日历
  renderCalendarGrid(PAYLOAD.calendar);

  // 盈亏归因
  renderAttribution(PAYLOAD.attribution);

  // 平仓明细（成交重建）
  renderTrades(PAYLOAD.trades_report, PAYLOAD.trades_pending);

  // 本地记录与离线时段
  renderLocal(LOCAL);

  // 近 3 个月资金曲线（内联 SVG，保持零外部依赖）
  renderEquity(PAYLOAD.equity);

  // 账户信息（不含任何密钥相关字段）
  show("account-section", true);
  var acc = [
    ["持仓模式", m.position_mode || "—"],
    ["手续费等级", m.fee_tier != null ? "VIP " + m.fee_tier : "—"],
    ["时钟偏移", (m.clock_offset_ms || 0) + " ms"],
    ["接口模式", "只读（无下单路径）"]
  ];
  $("account-body").innerHTML = acc.map(function (r) {
    return '<div class="kv"><span class="k">' + esc(r[0]) + '</span><span class="v">' +
      esc(r[1]) + "</span></div>";
  }).join("");
}

// ------------------------------------------------------------------ 实时刷新
//
// 设计意图：页面**内嵌**一份数据，所以首屏立即可用、离线也能看；
// snapshot.json 只负责让数字变新。它只有完整页面的约 2%（2KB vs 85KB），
// 因此可以比页面本身更频繁地更新，而不必重新发布页面。
//
// 三个必须做对的细节：
//   1. 取不到就静默保持内嵌数据，绝不把好页面变成错误态
//   2. 只认 status=ok 的响应，避免用 error 覆盖已有数据
//   3. 数据没变就不重绘，省掉无谓的 DOM 重建
var _liveTimer = null, _liveKey = null, _liveFails = 0;

function startLiveRefresh() {
  // 页面本身就是"数据不可用"状态时不必刷新（通常意味着密钥还没配）
  if (DATA.status !== "ok") return;

  var tick = function () {
    fetch("snapshot.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (live) {
        applyLive(live);
        _liveFails = 0;
      })
      .catch(function () {
        _liveFails++;
        // 只在连续失败时提示一次，避免网络抖动反复打扰
        if (_liveFails === 3) {
          var el = $("live-state");
          if (el) {
            el.className = "muted";
            el.textContent = "实时数据暂不可用，显示的是页面生成时的快照";
          }
        }
      });
  };
  tick();
  _liveTimer = setInterval(tick, 120000);   // 2 分钟
}

function applyLive(live) {
  if (!live || !live.snapshot || live.snapshot.status !== "ok") return;

  // 同一份数据不重复重绘
  var meta = live.meta || {};
  var key = String(meta.generated_at_local || meta.exported_at || "") +
            "|" + ((live.snapshot.positions || []).length);
  if (key === _liveKey) return;
  _liveKey = key;

  PAYLOAD = live;
  DATA = live.snapshot;
  META = live.meta || META;
  if (live.cost_analysis) COST = live.cost_analysis;
  if (live.risk_analysis) RISK = live.risk_analysis;
  if (live.local) LOCAL = live.local;
  // 平仓明细首次可能还在计算中；一旦有结果就替换掉"正在计算"的提示
  if (live.trades_report) {
    PAYLOAD.trades_report = live.trades_report;
    PAYLOAD.trades_pending = false;
  }

  render();
  renderCostAnalysis(COST);
  renderRisk(RISK);
  renderTrades(PAYLOAD.trades_report, PAYLOAD.trades_pending);
  renderAttribution(PAYLOAD.attribution);

  var el = $("live-state");
  if (el) {
    el.className = "live-flag";
    el.textContent = "已刷新至 " +
      (META.generated_at_local || META.generated_at || "—") + "（每 2 分钟自动更新）";
  }
}

render();
startLiveRefresh();
setupDownloads();
renderExportHealth(PAYLOAD.export_health);

</script>
