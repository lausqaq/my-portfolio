<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Laus持仓看板</title>
<style>
:root {
  --bg: #0b0e13;
  --panel: #131823;
  --panel-2: #182030;
  --line: #232c3d;
  --text: #e6ecf5;
  --muted: #8393ab;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --radius: 10px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 12px 20px;
  background: rgba(11, 14, 19, 0.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand strong { font-size: 16px; letter-spacing: .3px; }
.tag {
  font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
}
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--muted); box-shadow: 0 0 0 0 rgba(34,197,94,.6);
}
.dot.live { background: var(--green); animation: pulse 2s infinite; }
.dot.stale { background: var(--amber); }
.dot.down { background: var(--red); }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
  70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}

.topbar-right { display: flex; align-items: center; gap: 12px; }
.meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.btn {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 12px; font-size: 12px; cursor: pointer;
}
.btn:hover { border-color: var(--blue); }
.btn.active { border-color: var(--green); color: var(--green); }

main { padding: 18px 20px 40px; max-width: 1500px; margin: 0 auto; }
.hidden { display: none !important; }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
}
.panel h2 {
  margin: 0 0 12px; font-size: 13px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: .8px;
}
.muted { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

.banner {
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
  border: 1px solid; font-size: 13px;
}
.banner.error { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.45); }
.banner.warn { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.45); }
.banner strong { display: block; margin-bottom: 4px; }

.setup {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px;
}
.setup h2 { margin-top: 0; font-size: 18px; }
.setup ol { padding-left: 20px; }
.setup li { margin-bottom: 6px; }
.setup code, .setup pre {
  background: #0a0d12; border: 1px solid var(--line); border-radius: 6px;
  font-family: Consolas, "Courier New", monospace; font-size: 12.5px;
}
.setup code { padding: 1px 6px; }
.setup pre { padding: 12px; overflow-x: auto; }
.setup .danger { color: var(--amber); }

.metrics {
  display: grid; gap: 12px; margin-bottom: 16px;
  /* 卡片现在含 2~3 行子项，窄了会折行，所以最小宽度比原先(180px)放宽 */
  grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
}
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px;
}
.card .label { font-size: 11.5px; color: var(--muted); letter-spacing: .4px; }
.card .value {
  font-size: 21px; font-weight: 600; margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.card .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* 卡片内的子项列表：把相关的数字归到一张卡里，而不是平铺成一排。
   比 .sub 那一行小字更易读——每项有独立的标签与右对齐的数值。 */
.card .items {
  margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line);
  display: grid; gap: 2px;
}
.card .item {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 8px; font-size: 12.5px;
}
.card .item .k { color: var(--muted); white-space: nowrap; }
.card .item .v {
  font-variant-numeric: tabular-nums; font-weight: 600; text-align: right;
}

.pos { color: var(--green); }
.neg { color: var(--red); }
.warnc { color: var(--amber); }

.health-track {
  height: 14px; border-radius: 999px; overflow: hidden;
  background: linear-gradient(90deg, #ef4444 0%, #f59e0b 35%, #22c55e 70%);
  opacity: .28; position: relative;
}
.health-fill {
  position: absolute; top: 0; right: 0; height: 100%;
  background: #0b0e13;
}
.health-labels {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 8px; font-size: 13px;
}
#health-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 8px 10px; color: var(--muted);
  font-size: 11.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
td {
  padding: 10px; border-bottom: 1px solid rgba(35,44,61,.6);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
tbody tr:hover { background: var(--panel-2); }
th.num, td.num { text-align: right; }

.sym { font-weight: 600; }
.side {
  display: inline-block; padding: 1px 8px; border-radius: 4px;
  font-size: 11.5px; font-weight: 600;
}
.side.LONG { background: rgba(34,197,94,.14); color: var(--green); }
.side.SHORT { background: rgba(239,68,68,.14); color: var(--red); }

.risk { font-size: 10.5px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
.risk.CRITICAL { background: rgba(239,68,68,.2); color: var(--red); }
.risk.WARNING { background: rgba(245,158,11,.2); color: var(--amber); }
.risk.WATCH { background: rgba(59,130,246,.2); color: var(--blue); }

.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert {
  display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px;
  border-left: 3px solid var(--muted); background: var(--panel-2); font-size: 13px;
}
.alert.CRITICAL { border-left-color: var(--red); }
.alert.WARNING { border-left-color: var(--amber); }
.alert.INFO { border-left-color: var(--blue); }
.alert .t { font-weight: 600; }
.alert .d { color: var(--muted); font-size: 12.5px; }

.two-col { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; } }

.kv-grid {
  display: grid; gap: 10px 20px;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}
/* 资产这类长内容占满整行，避免挤在半列里换行 */
.kv-grid.has-wide .kv-wide { grid-column: 1 / -1; }
.kv {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; border-bottom: 1px dashed rgba(35,44,61,.8); padding-bottom: 6px;
}
.kv .k { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.kv .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }

.bars { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.bar-row { display: grid; grid-template-columns: 90px 1fr 92px;
  align-items: center; gap: 10px; font-size: 12.5px; }
/* 复盘区多一列"条数/笔数" */
.bar-row.day-row, .bar-row.sym-row {
  grid-template-columns: 62px 1fr 92px 64px;
}
.bar-row.sym-row { grid-template-columns: 96px 1fr 92px 64px; }
.sub-h {
  margin: 18px 0 4px; font-size: 12px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
}
.bar-track { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }

/* 占比条：表格里的行内小条，直观看出集中程度 */
.share-cell {
  display: flex; align-items: center; gap: 8px;
  justify-content: flex-end; min-width: 108px;
}
.share-cell > span { min-width: 44px; text-align: right; }
.share-bar {
  height: 6px; border-radius: 999px; flex: 1;
  /* 用已定义的调色板变量；曾误用不存在的 --accent，样式会静默失效 */
  background: linear-gradient(90deg, var(--blue), var(--green));
  min-width: 2px;
}

/* 盈亏日历：每列一周、每行一个星期几（与 GitHub 贡献图一致） */
.cal-wrap { display: flex; gap: 6px; margin: 6px 0 4px; overflow-x: auto; }
.cal-labels {
  display: grid; grid-template-rows: repeat(7, 13px); gap: 3px;
  /* 必须给固定宽度：否则 grid 项会被拉伸到整行，标签跑到右边去 */
  flex: 0 0 20px; width: 20px;
}
.cal-wd {
  font-size: 10px; color: var(--muted); line-height: 13px; height: 13px;
  text-align: right; width: 20px;
}
.cal-grid {
  display: grid; grid-template-rows: repeat(7, 13px); gap: 3px;
  grid-auto-flow: column; grid-auto-columns: 13px;
}
.cal-cell { width: 13px; height: 13px; border-radius: 3px; }
.cal-cell.empty { background: transparent; }
.cal-cell.nodata { background: var(--panel-2); opacity: .45; }
.cal-cell.flat { background: var(--line); }
/* 正收益：绿色由浅到深 */
.cal-cell.pos-1 { background: rgba(34,197,94,.28); }
.cal-cell.pos-2 { background: rgba(34,197,94,.50); }
.cal-cell.pos-3 { background: rgba(34,197,94,.72); }
.cal-cell.pos-4 { background: rgba(34,197,94,1); }
/* 亏损：红色由浅到深 */
.cal-cell.neg-1 { background: rgba(239,68,68,.28); }
.cal-cell.neg-2 { background: rgba(239,68,68,.50); }
.cal-cell.neg-3 { background: rgba(239,68,68,.72); }
.cal-cell.neg-4 { background: rgba(239,68,68,1); }

footer {
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 14px 20px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 11.5px;
}
.empty { color: var(--muted); padding: 14px 4px; font-size: 13px; }

.static-badge {
  font-size: 11px; color: var(--amber); border: 1px solid rgba(245,158,11,.5);
  border-radius: 999px; padding: 2px 8px;
}
/* 数据导出按钮：小而不抢眼，但可点区域要够大 */
.dl-btn {
  font-size: 11px; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; cursor: pointer; margin-left: 8px;
}
.dl-btn:hover { border-color: var(--blue); color: #fff; }
.dl-btn:disabled { opacity: .45; cursor: default; }
.chart-wrap { margin: 4px 0 8px; }
.chart-wrap svg { display: block; overflow: visible; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot live"></span>
    <strong>Laus持仓看板</strong>
    <span class="tag">USDⓈ-M · BINANCE</span>
    <span class="static-badge">静态快照</span>
  </div>
  <div class="topbar-right">
    <span class="meta" id="gen-time"></span>
    <button class="dl-btn" id="dl-account" type="button">导出账户快照 CSV</button>
    <button class="dl-btn" id="dl-trades" type="button">导出持仓明细 CSV</button>
  </div>
</header>

<main>
  <div id="banner" class="banner hidden"></div>
  <div id="export-health" class="hidden"></div>

  <section id="alerts-section" class="panel hidden">
    <h2>风险提醒</h2>
    <div id="alerts" class="alerts"></div>
  </section>

  <section id="metrics-section" class="metrics hidden"></section>

  <section id="health-section" class="panel hidden">
    <h2>保证金健康度</h2>
    <div class="health-wrap">
      <div class="health-track"><div id="health-fill" class="health-fill"></div></div>
      <div class="health-labels">
        <span id="health-value">—</span>
        <span id="health-detail" class="muted"></span>
      </div>
    </div>
  </section>

  <section id="positions-section" class="panel hidden">
    <h2>持仓明细 <span id="pos-count" class="muted"></span></h2>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>合约</th><th>方向</th><th class="num">数量</th><th class="num">开仓价</th>
          <th class="num">标记价</th><th class="num">名义价值</th><th class="num">未实现盈亏</th>
          <th class="num">保证金占用</th><th class="num">强平价 / 距离</th>
          <th class="num">资金费（估算）</th><th>模式</th>
        </tr></thead>
        <tbody id="positions-body"></tbody>
      </table>
    </div>
  </section>

  <section id="calendar-section" class="panel hidden">
    <h2>盈亏日历 <span id="calendar-range" class="muted"></span></h2>
    <div id="calendar-body"></div>
  </section>

  <section id="equity-section" class="panel hidden">
    <h2>近 3 个月资金曲线 <span id="equity-range" class="muted"></span></h2>
    <div id="equity-body"></div>
  </section>


</main>

<footer>
  <span>静态快照：页面内容为导出时刻的数据，不会自动刷新。</span>
  <span class="muted" id="foot-status"></span>
</footer>

  function level(v) {
    if (!v) return 0;
    var r = Math.abs(v) / maxAbs;
    if (r < 0.25) return 1;
    if (r < 0.5) return 2;
    if (r < 0.75) return 3;
    return 4;
  }

  var first = null, last = null;
  cal.weeks.forEach(function (wk) {
    wk.forEach(function (d) {
      if (!d) return;
      if (!first) first = d.date;
      last = d.date;
    });
  });
  $("calendar-range").textContent = "· " + first + " ~ " + last;

  var out = "";
  out += '<div class="kv-grid" style="margin-bottom:12px">' +
    '<div class="kv"><span class="k">交易盈亏合计</span><span class="v ' +
      cls(cal.total) + '">' + signedMoney(cal.total) + "</span></div>" +
    '<div class="kv"><span class="k">有成交天数</span><span class="v">' +
      cal.traded_days + ' <span class="muted">天</span></span></div>' +
    '<div class="kv"><span class="k">盈利 / 亏损天</span><span class="v">' +
      '<span class="pos">' + cal.win_days + '</span> / <span class="neg">' +
      cal.lose_days + "</span></span></div>" +
    '<div class="kv"><span class="k">最佳单日</span><span class="v pos">' +
      signedMoney(cal.best.value) + ' <span class="muted">' +
      esc(cal.best.date) + "</span></span></div>" +
    '<div class="kv"><span class="k">最差单日</span><span class="v neg">' +
      signedMoney(cal.worst.value) + ' <span class="muted">' +
      esc(cal.worst.date) + "</span></span></div>" +
    '<div class="kv"><span class="k">最长连续亏损</span><span class="v ' +
      (cal.worst_losing_streak >= 4 ? "warnc" : "") + '">' +
      cal.worst_losing_streak + ' <span class="muted">天</span></span></div>' +
  "</div>";

  // 星期几标签 + 网格
  var labels = _WD.map(function (w) {
    return '<div class="cal-wd">' + w + "</div>";
  }).join("");

  var cells = cal.weeks.map(function (wk) {
    return wk.map(function (d) {
      if (!d) return '<div class="cal-cell empty"></div>';
      var lv = level(d.value);
      var kind = d.value > 0 ? "pos" : d.value < 0 ? "neg" : "flat";
      var cls2 = "cal-cell " + kind + "-" + lv + (d.no_data ? " nodata" : "");
      return '<div class="' + cls2 + '" title="' + esc(d.date) + "  " +
        (d.value >= 0 ? "+" : "") + d.value.toFixed(2) +
        (d.records ? "  （" + d.records + " 笔）" : "  （无成交）") +
        '"></div>';
    }).join("");
  }).join("");

  out += '<div class="cal-wrap"><div class="cal-labels">' + labels +
    '</div><div class="cal-grid">' + cells + "</div></div>";

  $("calendar-body").innerHTML = out;
}

// ------------------------------------------------------------------ 数据导出
//
// 用 Blob 在前端生成 CSV 并触发下载——页面是自包含的，
// 不需要后端、也不必回到这台机器上跑脚本。
// **开头写 UTF-8 BOM**：否则 Excel 会把中文表头当成乱码。
function downloadCsv(filename, text) {
  if (!text) return false;
  var blob = new Blob(["\ufeff" + text], { type: "text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  return true;
}

function csvEscape(v) {
  var s = (v == null ? "" : String(v));
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function buildPositionsCsv() {
  var pos = (DATA && DATA.positions) || [];
  var live = pos.filter(function (p) { return p.side && p.side !== "FLAT"; });
  if (!live.length) return "";
  var cols = [
    ["symbol", "合约"], ["side", "方向"], ["position_amt", "数量"],
    ["entry_price", "开仓价"], ["mark_price", "标记价"],
    ["notional", "名义价值"], ["unrealized_pnl", "未实现盈亏"],
    ["leverage", "杠杆"], ["initial_margin", "初始保证金"],
    ["maintenance_margin", "维持保证金"],
    ["liquidation_price", "强平价"],
    ["liquidation_distance_pct", "强平距离%"],
    ["margin_ratio_pct", "保证金率%"], ["risk_level", "风险"],
    ["funding_rate", "资金费率"], ["margin_type", "保证金模式"]
  ];
  var out = [cols.map(function (c) { return c[1]; }).join(",")];
  live.forEach(function (p) {
    out.push(cols.map(function (c) { return csvEscape(p[c[0]]); }).join(","));
  });
  return out.join("\n");
}

function bindDownload(id, builder) {
  var btn = $(id);
  if (!btn) return;
  btn.addEventListener("click", function () {
    var text = builder();
    if (!text) {
      var old = btn.textContent;
      btn.textContent = "当前没有可导出的数据";
      btn.disabled = true;
      setTimeout(function () { btn.textContent = old; btn.disabled = false; }, 2000);
      return;
    }
    var base = PAYLOAD.filename_base || "binance-dashboard";
    downloadCsv(base + "-" + id.replace("dl-", "") + ".csv", text);
  });
}

function setupDownloads() {
  bindDownload("dl-account", function () {
    return (PAYLOAD.csv && PAYLOAD.csv.account) || "";
  });
  bindDownload("dl-trades", buildPositionsCsv);
}

// ------------------------------------------------------------------ 导出健康
//
// 定时任务静默失败时，页面上的数字会"看起来正常但其实是旧的"。
// 这个横幅把这些情况显式说出来：连续失败、数据陈旧。
function renderExportHealth(h) {
  if (!h || !h.available) return;
  var problems = h.problems || [];
  // INFO 级（例如"尚无导出记录"）不放顶部，避免噪音
  var notable = problems.filter(function (p) {
    return p.level === "WARNING" || p.level === "CRITICAL";
  });
  if (!notable.length) return;

  var cells = notable.map(function (p) {
    return '<div class="alert ' + p.level + '"><div><div class="t">' +
      esc(p.title) + '</div><div class="d">' + esc(p.detail) + "</div></div></div>";
  }).join("");

  // 近期成功率是**异常时需要看到的上下文**，所以保留一行状态，
  // 而不是塞进被移除的灰色小字里（那行小字整块都不要了）。
  if (h.recent_total != null) {
    var rate = "近 " + h.recent_total + " 次导出成功 " + h.recent_ok + "/" + h.recent_total;
    if (h.stale_minutes != null) {
      rate += "，数据距今 " + (h.stale_minutes < 90
        ? Math.round(h.stale_minutes) + " 分钟"
        : (h.stale_minutes / 60).toFixed(1) + " 小时");
    }
    cells += '<div class="alert INFO"><div><div class="d">' +
      esc(rate) + "</div></div></div>";
  }

  var el = $("export-health");
  if (!el) return;
  el.className = "panel";
  el.innerHTML = '<h2>导出链路提醒</h2><div class="alerts">' + cells + "</div>";
}




function renderEquity(eq) {
  if (!eq || eq.empty || !eq.series || !eq.series.length) return;
  show("equity-section", true);

  var t = eq.totals || {};
  $("equity-range").textContent = "· " + eq.start + " ~ " + eq.end +
    "（" + eq.days + " 天，" + eq.record_count + " 条流水）";

  // ---- 内联 SVG 曲线：累计交易盈亏 ----
  var W = 1000, H = 260, PL = 62, PR = 16, PT = 14, PB = 26;
  var iw = W - PL - PR, ih = H - PT - PB;
  var pts = eq.series.map(function (d) { return d.cumulative_trade; });
  var lo = Math.min.apply(null, pts.concat([0]));
  var hi = Math.max.apply(null, pts.concat([0]));
  if (hi === lo) { hi = lo + 1; }
  var pad = (hi - lo) * 0.08;
  lo -= pad; hi += pad;
  var n = pts.length;
  var X = function (i) { return PL + (n <= 1 ? iw / 2 : iw * i / (n - 1)); };
  var Y = function (v) { return PT + ih * (1 - (v - lo) / (hi - lo)); };

  var line = pts.map(function (v, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); }).join(" ");
  var area = line + " L" + X(n - 1).toFixed(1) + " " + Y(0).toFixed(1) +
             " L" + X(0).toFixed(1) + " " + Y(0).toFixed(1) + " Z";
  var zeroY = Y(0);

  // 网格与刻度
  var ticks = "";
  for (var k = 0; k <= 4; k++) {
    var v = lo + (hi - lo) * k / 4;
    var y = Y(v);
    ticks += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) +
             '" y2="' + y.toFixed(1) + '" stroke="#232c3d" stroke-width="1"/>' +
             '<text x="' + (PL - 6) + '" y="' + (y + 3.5).toFixed(1) +
             '" fill="#8393ab" font-size="10" text-anchor="end">' +
             (v >= 0 ? "+" : "") + Math.round(v).toLocaleString() + "</text>";
  }
  // X 轴日期（首、中、末）
  var xs = [0, Math.floor(n / 2), n - 1].map(function (i) {
    return '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) +
           '" fill="#8393ab" font-size="10" text-anchor="middle">' +
           eq.series[i].date.slice(5) + "</text>";
  }).join("");

  var svg = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto">' +
    ticks +
    '<line x1="' + PL + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - PR) +
      '" y2="' + zeroY.toFixed(1) + '" stroke="#3a465c" stroke-width="1" stroke-dasharray="3 3"/>' +
    '<path d="' + area + '" fill="rgba(34,197,94,0.10)"/>' +
    '<path d="' + line + '" fill="none" stroke="#22c55e" stroke-width="2"/>' +
    xs + "</svg>";

  // ---- 类型明细条形 ----
  var typeNames = {
    REALIZED_PNL: "已实现盈亏", COMMISSION: "手续费", FUNDING_FEE: "资金费",
    COMMISSION_REBATE: "返佣"
  };
  var tkeys = Object.keys(eq.types || {});
  var maxT = Math.max.apply(null, tkeys.map(function (k) { return Math.abs(eq.types[k]); }).concat([1e-9]));
  var typeRows = tkeys.map(function (k) {
    var v = eq.types[k];
    var w = Math.abs(v) / maxT * 100;
    var col = v >= 0 ? "var(--green)" : "var(--red)";
    return '<div class="bar-row sym-row"><span class="muted">' + esc(typeNames[k] || k) +
      '</span><div class="bar-track"><div class="bar-fill" style="width:' + w +
      "%;background:" + col + '"></div></div><span class="' + cls(v) +
      '" style="text-align:right">' + signedMoney(v) + "</span><span></span></div>";
  }).join("");

  $("equity-body").innerHTML =
    '<div class="kv-grid">' +
      '<div class="kv"><span class="k">交易盈亏（3 个月）</span><span class="v ' + cls(t.trading_pnl) + '">' + signedMoney(t.trading_pnl) + "</span></div>" +
      '<div class="kv"><span class="k">资金变化（含出入金）</span><span class="v ' + cls(t.net) + '">' + signedMoney(t.net) + "</span></div>" +
      '<div class="kv"><span class="k">出入金净额</span><span class="v ' + cls(t.capital_flow) + '">' + signedMoney(t.capital_flow) + "</span></div>" +
      '<div class="kv"><span class="k">最大回撤</span><span class="v neg">' + signedMoney(eq.max_drawdown) + "</span></div>" +
      '<div class="kv"><span class="k">盈利 / 亏损天数</span><span class="v">' + eq.win_days + " / " + eq.lose_days + "</span></div>" +
      '<div class="kv"><span class="k">最佳 / 最差单日</span><span class="v"><span class="pos">' +
        signedMoney(eq.best_day.value) + '</span> / <span class="neg">' + signedMoney(eq.worst_day.value) + "</span></span></div>" +
    "</div>" +
    '<h3 class="sub-h">累计交易盈亏曲线（不含出入金，单位 USDT）</h3>' +
    '<div class="chart-wrap">' + svg + "</div>" +
    '<h3 class="sub-h" style="margin-top:26px">资金构成</h3>' +
    '<div class="bars">' + typeRows + "</div>";
}

function render() {
  $("gen-time").textContent = "数据时间 " + (META.generated_at_local || META.generated_at || "—");
  $("foot-status").textContent = "导出时间 " + META.exported_at;

  if (DATA.status !== "ok" && DATA.status !== undefined) {
    $("banner").className = "banner error";
    $("banner").innerHTML = "<strong>快照不可用</strong><span>" +
      esc(DATA.message || DATA.status) + "</span>";
    show("banner", true);
    return;
  }

  var m = DATA.metrics || {}, ps = DATA.position_summary || {};

  // 提醒
  var alerts = DATA.alerts || [];
  if (alerts.length) {
    show("alerts-section", true);
    $("alerts").innerHTML = alerts.map(function (a) {
      return '<div class="alert ' + a.level + '"><div><div class="t">' + esc(a.title) +
             '</div><div class="d">' + esc(a.detail) + "</div></div></div>";
    }).join("");
  }

  // 指标卡
  //
  // 按含义分组，而不是把 6 个数字平铺（平铺时相关的数被拆得到处都是）：
  //   * 钱包那张：钱包余额 + 未实现盈亏（你的钱和当前浮盈）
  //   * 保证金那张：维持保证金 + 保证金余额 + 保证金率 + 可用余额
  //     保证金余额与保证金率**不做小字**——跨仓/全仓判断时会经常看，
  //     给它们独立一行、数值加粗。
  var marginPct = isNum(m.margin_ratio) ? (m.margin_ratio * 100).toFixed(2) + "%" : "—";
  var cards = [
    { label: "钱包余额", value: money(m.wallet_balance), items: [
      ["未实现盈亏", '<span class="' + cls(m.unrealized_pnl) + '">' +
        signedMoney(m.unrealized_pnl) + "</span>"]
    ] },
    { label: "保证金", value: money(m.margin_balance), items: [
      ["维持保证金", money(m.maintenance_margin)],
      ["保证金率", marginPct],
      ["可用余额", money(m.available_balance)]
    ] },
    { label: "持仓名义价值", value: money(ps.gross_notional), items: [
      ["净敞口", signedMoney(ps.net_notional)],
      ["账户杠杆", num(m.account_leverage, 2) + "x"],
      ["持仓数", (ps.count || 0) + "（多 " + (ps.long_count || 0) +
        " / 空 " + (ps.short_count || 0) + "）"]
    ] },
    { label: "多空名义比", value: isNum(ps.long_short_ratio)
        ? ps.long_short_ratio.toFixed(2) : "—", items: [
      ["多头", money(ps.long_notional, 0)],
      ["空头", money(ps.short_notional, 0)]
    ] }
  ];
  show("metrics-section", true);
  $("metrics-section").innerHTML = cards.map(function (c) {
    var items = (c.items || []).map(function (r) {
      return '<div class="item"><span class="k">' + esc(r[0]) +
        '</span><span class="v">' + r[1] + "</span></div>";
    }).join("");
    return '<div class="card"><div class="label">' + esc(c.label) +
      '</div><div class="value">' + c.value + "</div>" +
      (items ? '<div class="items">' + items + "</div>" : "") + "</div>";
  }).join("");

  // 保证金健康度
  var h = isNum(m.margin_health_pct) ? m.margin_health_pct : 100;
  show("health-section", true);
  $("health-fill").style.width = Math.max(0, Math.min(100, 100 - h)) + "%";
  var color = h < 20 ? "var(--red)" : h < 40 ? "var(--amber)" : "var(--green)";
  $("health-value").innerHTML = '<span style="color:' + color + '">' + h.toFixed(1) + "%</span>";
  $("health-detail").textContent = "维持保证金率 " + ((m.margin_ratio || 0) * 100).toFixed(2) +
    "%（" + (m.margin_ratio_source === "computed" ? "本地计算" : m.margin_ratio_source || "—") +
    "） · 初始保证金 " + money(m.initial_margin) + " · 账户模式 " + (m.position_mode || "—");

  // 持仓
  var rows = DATA.positions || [];
  show("positions-section", true);
  $("pos-count").textContent = "· " + rows.length + " 个持仓";
  if (!rows.length) {
    $("positions-body").innerHTML = '<tr><td colspan="11" class="empty">导出时没有持仓。</td></tr>';
  } else {
    $("positions-body").innerHTML = rows.map(function (p) {
      var dist = p.liquidation_distance_pct;
      var riskTag = p.risk_level && p.risk_level !== "SAFE"
        ? '<span class="risk ' + p.risk_level + '">' + p.risk_level + "</span>" : "";
      return "<tr>" +
        '<td class="sym">' + esc(p.symbol) + "</td>" +
        '<td><span class="side ' + p.side + '">' + (p.side === "LONG" ? "多" : "空") + "</span>" + riskTag + "</td>" +
        '<td class="num">' + num(Math.abs(p.position_amt), 8) + "</td>" +
        '<td class="num">' + num(p.entry_price, 8) + "</td>" +
        '<td class="num">' + num(p.mark_price, 8) + "</td>" +
        '<td class="num">' + money(p.notional, 2) + '<br><span class="muted" style="font-size:11px">' +
          num(p.leverage, 0) + "x 杠杆</span></td>" +
        '<td class="num ' + cls(p.unrealized_pnl) + '">' + signedMoney(p.unrealized_pnl) +
          '<br><span class="muted" style="font-size:11px">' + pct(p.return_on_margin_pct) + "</span></td>" +
        '<td class="num">' + money(p.initial_margin, 2) +
          '<br><span class="muted" style="font-size:11px">' +
          (isNum(p.margin_ratio_pct) ? p.margin_ratio_pct.toFixed(2) + "% 占用" : "占用率 n/a") + "</span></td>" +
        '<td class="num">' + (p.liquidation_price ? num(p.liquidation_price, 8) : "—") +
          '<br><span class="' + (isNum(dist) ? cls(-dist) : "") + '" style="font-size:11px">' +
          (isNum(dist) ? pct(dist) : "—") + "</span></td>" +
        '<td class="num ' + cls(p.funding_cost_daily) + '">' +
          (isNum(p.funding_cost_daily)
            ? signedMoney(p.funding_cost_daily, 2) + '<span class="muted">/天</span>'
            : "—") +
          '<br><span class="muted" style="font-size:11px">' +
          (isNum(p.funding_rate) ? (p.funding_rate * 100).toFixed(4) + "%" : "") +
          (isNum(p.funding_interval_hours)
            ? " · " + p.funding_interval_hours + "h" : "") + "</span></td>" +
        "<td>" + (p.margin_type === "ISOLATED" ? "逐仓" : "全仓") + "</td></tr>";
    }).join("");
  }



  // 盈亏日历
  renderCalendarGrid(PAYLOAD.calendar);


  // 近 3 个月资金曲线（内联 SVG，保持零外部依赖）
  renderEquity(PAYLOAD.equity);

}

// ------------------------------------------------------------------ 实时刷新
//
// 设计意图：页面**内嵌**一份数据，所以首屏立即可用、离线也能看；
// snapshot.json 只负责让数字变新。它只有完整页面的约 2%（2KB vs 85KB），
// 因此可以比页面本身更频繁地更新，而不必重新发布页面。
//
// 三个必须做对的细节：
//   1. 取不到就静默保持内嵌数据，绝不把好页面变成错误态
//   2. 只认 status=ok 的响应，避免用 error 覆盖已有数据
//   3. 数据没变就不重绘，省掉无谓的 DOM 重建
var _liveTimer = null, _liveKey = null, _liveFails = 0;

function startLiveRefresh() {
  // 页面本身就是"数据不可用"状态时不必刷新（通常意味着密钥还没配）
  if (DATA.status !== "ok") return;

  var tick = function () {
    fetch("snapshot.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (live) {
        applyLive(live);
        _liveFails = 0;
      })
      .catch(function () {
        // 取不到新数据就静默保持内嵌那份：
        // 页面首屏本来就有完整数据，刷新失败不该把它变成错误态。
        // （原先这里会往顶部写一行"实时数据暂不可用"，
        //   但那行字与"数据时间"重复且更啰嗦，已按需求去掉。）
        _liveFails++;
      });
  };
  tick();
  _liveTimer = setInterval(tick, 120000);   // 2 分钟
}

function applyLive(live) {
  if (!live || !live.snapshot || live.snapshot.status !== "ok") return;

  // 同一份数据不重复重绘
  var meta = live.meta || {};
  var key = String(meta.generated_at_local || meta.exported_at || "") +
            "|" + ((live.snapshot.positions || []).length);
  if (key === _liveKey) return;
  _liveKey = key;

  PAYLOAD = live;
  DATA = live.snapshot;
  META = live.meta || META;

  render();
}

render();
startLiveRefresh();
setupDownloads();
renderExportHealth(PAYLOAD.export_health);

</script>
